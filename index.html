<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base62 coder</title>
</head>
<body style="font-family:'Segoe UI',system-ui,sans-serif;background:#f5f6f7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;">
<h1 style="font-size:24px;color:#1f2937;margin:0 0 14px 0;font-weight:600;">Base62 coder</h1>
<textarea id="ta" cols="60" rows="10" spellcheck="false" wrap="off" placeholder="Type text to Encode, or Base62 to Decode" style="font-family:Consolas,'Courier New',monospace;font-size:16px;line-height:1.45;padding:10px;border:2px solid #b6bcc2;border-radius:8px;background:#fff;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;"></textarea>
<div style="margin-top:10px;display:flex;gap:8px;">
<button id="btnEnc" style="min-width:100px;padding:8px 18px;font-size:15px;font-family:inherit;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">Encode</button>
<button id="btnDec" style="min-width:100px;padding:8px 18px;font-size:15px;font-family:inherit;background:#6b7280;color:#fff;border:none;border-radius:6px;cursor:pointer;">Decode</button>
</div>
<div id="status" style="margin-top:10px;font-size:14px;min-height:20px;max-width:60ch;text-align:center;"></div>
<script>
"use strict";
var A62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
var VAL = {};
for (var i = 0; i < 62; i++) VAL[A62[i]] = i;
function bytesToBig(b) {
  var n = 0n;
  for (var i = 0; i < b.length; i++) n = (n << 8n) | BigInt(b[i]);
  return n;
}
function bigTo62(n) {
  if (n === 0n) return "";
  var out = "";
  while (n > 0n) { out = A62[Number(n % 62n)] + out; n /= 62n; }
  return out;
}
function b62ToBig(s) {
  var n = 0n;
  for (var i = 0; i < s.length; i++) n = n * 62n + BigInt(VAL[s[i]]);
  return n;
}
function bigToBytes(n) {
  if (n === 0n) return [];
  var d = [];
  while (n > 0n) { d.push(Number(n & 255n)); n >>= 8n; }
  return d.reverse();
}
function utf8DecodeStrict(bytes) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes)); }
  catch (e) { return null; }
}
function encode62(text) {
  return bigTo62(bytesToBig(Array.from(new TextEncoder().encode(text))));
}
function decode62(s) {
  return utf8DecodeStrict(bigToBytes(b62ToBig(s)));
}
var CHARS = /^[0-9A-Za-z]+$/;
function showStatus(msg, ok) {
  var el = document.getElementById("status");
  el.textContent = msg;
  el.style.color = ok ? "#374151" : "#b91c1c";
}
function doEncode() {
  var t = document.getElementById("ta").value;
  if (t.length === 0) { showStatus("Nothing to encode", true); return; }
  var out = encode62(t);
  setTa(out);
  showStatus("\u2713 Encoded " + t.length + " chars \u2192 " + out.length + " chars", true);
}
function doDecode() {
  var s = document.getElementById("ta").value;
  if (s.length === 0) { showStatus("Nothing to decode", true); return; }
  if (!CHARS.test(s)) { showStatus("Error: invalid character(s)", false); return; }
  var txt = decode62(s);
  if (txt === null) { showStatus("Error: not valid UTF-8", false); return; }
  setTa(txt);
  showStatus("\u2713 Decoded " + s.length + " chars \u2192 " + txt.length + " chars", true);
}
function setTa(v) {
  var ta = document.getElementById("ta");
  ta.value = v;
  ta.focus();
  ta.select();
}
document.getElementById("btnEnc").addEventListener("click", doEncode);
document.getElementById("btnDec").addEventListener("click", doDecode);
</script>

</body>
</html>
